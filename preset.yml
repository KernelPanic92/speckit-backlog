schema_version: "1.0"

preset:
  id: "backlog"
  name: "Backlog-Driven SDD"
  version: "0.1.0"
  description: "Manage reusable Agile/BDD PBIs and plan feature delivery with deterministic waves, modular Spec Kit artifacts, feature research, and durable ADRs."
  author: "Iacopo Ciao"
  repository: "https://github.com/KernelPanic92/speckit-backlog"
  license: "MIT"

requires:
  speckit_version: ">=1.2.5"

provides:
  templates:
    # --- Templates -----------------------------------------------------------
    - type: "template"
      name: "constitution-template"
      file: "templates/constitution-template.md"
      description: "Constitution: principles, stack, MUST/SHOULD/MAY rules, agent boundaries, quality, security, delivery conventions, governance - no document versioning"
      replaces: "constitution-template"

    - type: "template"
      name: "product-template"
      file: "templates/product-template.md"
      description: "Product context: vision, personas, journeys, constraints and the Ubiquitous Language (written by /constitution)"

    - type: "template"
      name: "design-template"
      file: "templates/design-template.md"
      description: "Design system in the DESIGN.md format (Google Labs, spec alpha): tokens in the front matter, visual rules in the prose (written by /constitution)"

    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "4-block spec: header and Scope, rendered central backlog/ references, Key Entities and measurable Success Criteria"
      replaces: "spec-template"

    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Concise upstream-compatible modular plan with data-model.md, contracts/, quickstart.md, delivery slices, and feature-specific deltas; durable decisions live in docs/adr/"
      replaces: "plan-template"

    - type: "template"
      name: "research-template"
      file: "templates/research-template.md"
      description: "Feature research separates empirical findings from conditional architectural trade-off matrices; durable project-wide decisions live in docs/adr/"

    - type: "template"
      name: "adr-template"
      file: "templates/adr-template.md"
      description: "Architecture Decision Record (MADR/Nygard): atomic decision, drivers, options, mandatory negative trade-offs, supersession — no dates/authors"

    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Deterministically generated task execution index: story/task waves, computed [P], TASK links and AC traceability"
      replaces: "tasks-template"

    - type: "template"
      name: "pbi-map-template"
      file: "templates/pbi-map-template.md"
      description: "Central backlog/maps/ PBI: Backbone Epics, Walking Skeleton and Outcome-based Release Lanes"

    - type: "template"
      name: "pbi-epic-template"
      file: "templates/pbi-epic-template.md"
      description: "Central backlog/epics/ PBI: open-ended goal or Backbone Macro-Activity, segmented into Features"

    - type: "template"
      name: "pbi-feature-template"
      file: "templates/pbi-feature-template.md"
      description: "Central backlog/features/ PBI: bounded capability, Outcome, cross-story Constraints and Out of Scope"

    - type: "template"
      name: "pbi-story-template"
      file: "templates/pbi-story-template.md"
      description: "Central backlog/stories/ PBI: Connextra, Gherkin AC ids, Out of Scope and INVEST check"

    - type: "template"
      name: "pbi-task-template"
      file: "templates/pbi-task-template.md"
      description: "Central backlog/tasks/ PBI: exact Files, Actions and DoD checkboxes as the sole task completion state"

    - type: "template"
      name: "pbi-spike-template"
      file: "templates/pbi-spike-template.md"
      description: "Central backlog/spikes/ PBI: timeboxed question, research or prototype output and Exit Criteria"

    # --- Commands that replace core commands ----------------------------------
    - type: "command"
      name: "speckit.constitution"
      file: "commands/speckit.constitution.md"
      description: "Constitution + product.md (personas, ubiquitous language) + design.md (DESIGN.md format), without document versioning"
      replaces: "speckit.constitution"

    - type: "command"
      name: "speckit.specify"
      file: "commands/speckit.specify.md"
      description: "Turn text or existing PBIs into a focused 4-block spec linked to reusable PBIs in central backlog/"
      replaces: "speckit.specify"

    - type: "command"
      name: "speckit.clarify"
      file: "commands/speckit.clarify.md"
      description: "Clarify scoped central PBIs and ancestors in place, logging accepted answers only in spec.md"
      replaces: "speckit.clarify"

    - type: "command"
      name: "speckit.plan"
      file: "commands/speckit.plan.md"
      description: "Single wave-aligned plan.md plus research.md resolving unknowns and desk-research Spikes"
      replaces: "speckit.plan"

    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Idempotently reconcile central TASK PBIs and render tasks.md with computed waves and [P] scheduling"
      replaces: "speckit.tasks"

    - type: "command"
      name: "speckit.analyze"
      file: "commands/speckit.analyze.md"
      description: "Read-only cross-artifact, central backlog, AC coverage and computed schedule consistency analysis"
      replaces: "speckit.analyze"

    # --- Commands composed on top of core commands -----------------------------
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Appends wave execution, one PR/worktree per US, parallel sub-agents and TASK-owned progress"
      strategy: "append"

    - type: "command"
      name: "speckit.checklist"
      file: "commands/speckit.checklist.md"
      description: "Appends 4-block spec and central backlog reference paths with readable PBI and AC traceability"
      strategy: "append"

    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Appends AC/outcome/scope findings and central TASK creation with deterministic index regeneration"
      strategy: "append"

    # --- New commands -----------------------------------------------------------
    - type: "command"
      name: "speckit.backlog"
      file: "commands/speckit.backlog.md"
      description: "Create, map, split, refine, reorder, and retire PBIs (MAP, EPIC, FEATURE, US, SPIKE) in the central backlog/"

tags:
  - "backlog"
  - "user-stories"
  - "story-mapping"
  - "bdd"
  - "invest"
